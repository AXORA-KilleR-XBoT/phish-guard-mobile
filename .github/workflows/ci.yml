name: Mobile CI

on:
  push:
    branches: [main]      # change this if your default branch has another name
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22   # the tests use Node's built-in TypeScript support (Node 22.18 or newer)
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check that the app bundles for Android (JavaScript only; no emulator or phone is used)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
        env:
          EXPO_NO_TELEMETRY: "1"
